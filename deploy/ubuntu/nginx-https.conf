# 证书签发后替换 HTTP 引导配置。未知 Host 不传到信任代理头的应用。
limit_req_zone $binary_remote_addr zone=ideastage_auth:10m rate=5r/m;

server {
    listen 80;
    server_name ideastage.top;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://ideastage.top$request_uri; }
}

server {
    # 兼容 Ubuntu 24.04 自带 nginx 1.24。
    listen 443 ssl http2;
    server_name ideastage.top;
    if ($host != ideastage.top) { return 444; }
    ssl_certificate /etc/letsencrypt/live/ideastage.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ideastage.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;

    location ~ ^/api/auth/(register|callback/credentials)$ {
        limit_req zone=ideastage_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/ideastage-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/ideastage-proxy.conf;
    }
}
