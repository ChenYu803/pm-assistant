    function showToast(message) { const toast=$("#toast"); toast.textContent=message; toast.classList.add("show"); clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>toast.classList.remove("show"),3200); }
    function focusFirst(root) { setTimeout(()=>root?.querySelector("input:not([disabled]), textarea, button")?.focus(),20); } function openLayer(id) { $("#"+id).classList.add("open"); document.body.style.overflow="hidden"; } function closeLayer(id) { $("#"+id).classList.remove("open"); if (!["modal-layer","drawer-layer","risk-layer"].some((l)=>$("#"+l).classList.contains("open"))) { document.body.style.overflow=""; if(state.lastTrigger && document.contains(state.lastTrigger)) state.lastTrigger.focus(); state.lastTrigger=null; } }
    function projectListHtml() { return state.projects.map((p)=>{ const open=state.menu===`project-${p.id}`, count=(state.iterations[p.id]||[]).length; return `<div class="project-item${state.selectedProject===p.id?" selected":""}"><button class="project-select" data-project="${p.id}" type="button"><strong title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</strong><span>${p.code}</span></button><button class="more-trigger" data-project-menu="${p.id}" type="button" aria-label="${escapeHtml(p.name)} 更多功能" aria-expanded="${open}">···</button><div class="project-menu${open?" open":""}"><div class="menu-meta">最近更新时间 · ${escapeHtml(p.updated)}<br>产品迭代数量 · ${count} 个</div><button class="menu-action" data-rename-project="${p.id}" type="button">重命名</button><button class="menu-action danger" data-delete-project="${p.id}" type="button">删除项目</button></div></div>`; }).join(""); }
    function iterationListHtml() { const items=currentIterations(); if(!items.length) return `<div class="empty-iterations"><p>这个项目还没有产品迭代。</p><button class="button primary" data-create-iteration type="button">创建产品迭代</button></div>`; return items.map((item)=>{ const open=state.menu===`iteration-${item.id}`; return `<article class="iteration-row"><span class="iteration-number">迭代 ${pad(item.id)}</span><div class="iteration-name"><strong title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</strong></div><p class="iteration-goal${item.goal?"":" empty"}">${item.goal?escapeHtml(item.goal):"尚未填写本轮目标 · 不会自动猜测"}</p><span class="status${item.status==="进行中"?" active":""}">${item.status}</span><span class="updated">更新 · ${escapeHtml(item.updated)}</span><div class="iteration-actions"><button class="button quiet" data-edit-iteration="${item.id}" type="button">编辑迭代</button><button class="more-trigger" data-iteration-menu="${item.id}" type="button" aria-label="${escapeHtml(item.name)} 更多功能" aria-expanded="${open}">···</button><div class="iteration-menu${open?" open":""}"><button class="menu-action" data-enter-iteration="${item.id}" type="button">进入工作区</button><button class="menu-action danger" data-delete-iteration="${item.id}" type="button">删除产品迭代</button></div></div></article>`; }).join(""); }
    function mainHtml() { if(!state.selectedProject) return `<section class="empty-state"><h2>让我们<span class="mobile-break"><br></span>开始工作</h2><p>先创建一个项目，或从左侧选择已有项目。</p><button class="button primary" data-create-project type="button">新建一个项目</button></section>`; const p=selectedProject(); if(state.workspace) return `<section class="workspace-placeholder"><p>工作区已打开。这里的工作台界面由后续原型定义。</p></section>`; return `<section class="project-view active${state.animateProject?" enter-once":""}"><header class="project-summary"><div><p class="eyebrow">SELECTED PROJECT / ${p.code}</p><h2>${escapeHtml(p.name)}</h2><div class="project-summary-meta"><span>${p.code}</span><span>最近更新 ${escapeHtml(p.updated)}</span></div></div></header><section class="iteration-section"><div class="iteration-section-head"><div><h3>产品迭代</h3><p>一个项目可以有多个迭代，稳定编号只增不减。</p></div><button class="button primary create-iteration" data-create-iteration type="button">创建产品迭代</button></div><div class="iteration-list">${iterationListHtml()}</div></section></section>`; }
    function render() { const animate=state.animateProject; $("#project-list").innerHTML=projectListHtml(); $(".main").innerHTML=mainHtml(); state.animateProject=false; bind(); if(animate) setTimeout(()=>$(".project-view")?.classList.remove("enter-once"),520); }
    function openModal(kind,payload={},trigger=null) { state.modal={kind,...payload}; state.lastTrigger=trigger||document.activeElement; const c=$("#modal-content"); if(kind==="create-project") c.innerHTML=`<p class="eyebrow">PROJECT / CREATE</p><h2>新建一个项目</h2><p>项目是长期容器，产品迭代和项目文件都归属于它。</p><div class="field"><label for="project-name">项目名称</label><input id="project-name" type="text" maxlength="80" placeholder="例如：小红书新用户体验"></div><div class="field"><label for="project-desc">项目描述（可选）</label><textarea id="project-desc" maxlength="300" placeholder="这个项目要解决什么问题？"></textarea></div><div class="modal-actions"><button class="button quiet" data-close-modal type="button">取消</button><button class="button primary" data-save-project type="button">创建项目</button></div>`; if(kind==="rename-project") c.innerHTML=`<p class="eyebrow">PROJECT / RENAME</p><h2>重命名项目</h2><div class="field"><label for="rename-project-name">项目名称</label><input id="rename-project-name" type="text" maxlength="80" value="${escapeHtml(payload.project.name)}"></div><div class="modal-actions"><button class="button quiet" data-close-modal type="button">取消</button><button class="button primary" data-save-rename type="button">保存名称</button></div>`; if(kind==="delete-project") c.innerHTML=`<p class="eyebrow">PROJECT / DELETE</p><h2>删除项目？</h2><p class="danger-copy">删除“${escapeHtml(payload.project.name)}”后，该项目下的产品迭代、聊天记录和项目文件都会被永久删除，且无法恢复。</p><div class="modal-actions"><button class="button quiet" data-close-modal type="button">取消</button><button class="button danger" data-confirm-delete-project type="button">确认删除项目</button></div>`; if(kind==="delete-iteration") c.innerHTML=`<p class="eyebrow">ITERATION / DELETE · 迭代 ${pad(payload.item.id)}</p><h2>删除产品迭代？</h2><p class="danger-copy">删除后，这一轮的聊天记录和还没确认保存的内容会被删除，但已确认保存的内容及其变更记录会保留。你可以在文件树内把这些内容彻底删除。</p><div class="modal-actions"><button class="button quiet" data-close-modal type="button">取消</button><button class="button danger" data-confirm-delete-iteration type="button">确认删除迭代</button></div>`; openLayer("modal-layer"); focusFirst(c); }
    function openDrawer(kind,payload={},trigger=null) { state.drawer={kind,...payload}; state.lastTrigger=trigger||document.activeElement; const c=$("#drawer-content"); if(kind==="create-iteration") c.innerHTML=`<div class="drawer-head"><div><p class="eyebrow">ITERATION / CREATE</p><h2>创建产品迭代</h2></div><button class="close-button" data-close-drawer type="button" aria-label="关闭创建面板">×</button></div><p class="drawer-intro">先给这一轮一个可读的名字，再明确你是否要提供本轮目标。两个选项都不会替你默认选择。</p><form id="create-form" novalidate><div class="field"><label for="create-name">展示名称 <span class="mono">REQUIRED</span></label><input id="create-name" type="text" maxlength="80" placeholder="例如：降低首次使用流失" required></div><fieldset class="choice-group"><legend>本轮目标 <span class="mono">CHOOSE ONE</span></legend><div class="choice-list"><label class="choice" data-choice="fill"><input type="radio" name="target-mode" value="fill"><span class="choice-marker">A</span><span><strong>填写本轮目标</strong><span>让四个阶段的 Agent 知道这一轮要解决什么。</span></span></label><label class="choice" data-choice="skip"><input type="radio" name="target-mode" value="skip"><span class="choice-marker">B</span><span><strong>暂不填写</strong><span>稍后仍可补充，但 Agent 不会替你猜测目标。</span></span></label></div></fieldset><div class="target-field" id="create-goal-field"><label for="create-goal">本轮目标</label><textarea id="create-goal" maxlength="500" placeholder="这一轮最想改变什么？"></textarea></div><p class="form-error" id="create-error" role="alert"></p><div class="drawer-actions"><button class="button quiet" data-close-drawer type="button">取消</button><button class="button primary" type="submit">创建并进入工作区</button></div></form>`; if(kind==="edit-iteration") c.innerHTML=`<div class="drawer-head"><div><p class="eyebrow">ITERATION / EDIT · 迭代 ${pad(payload.item.id)}</p><h2>编辑产品迭代</h2></div><button class="close-button" data-close-drawer type="button" aria-label="关闭编辑面板">×</button></div><p class="drawer-intro">展示名称和本轮目标可以随时更新。稳定编号是这次迭代的长期身份，创建后不可修改。</p><form id="edit-form" novalidate><div class="field"><label for="edit-number">稳定编号</label><input id="edit-number" type="text" value="迭代 ${pad(payload.item.id)}" disabled></div><div class="field"><label for="edit-name">展示名称 <span class="mono">REQUIRED</span></label><input id="edit-name" type="text" maxlength="80" value="${escapeHtml(payload.item.name)}" required></div><div class="field"><label for="edit-goal">本轮目标 <span class="mono">OPTIONAL</span></label><textarea id="edit-goal" maxlength="500" placeholder="这一轮最想改变什么？">${escapeHtml(payload.item.goal)}</textarea></div><p class="form-error" id="edit-error" role="alert"></p><div class="drawer-actions"><button class="button quiet" data-close-drawer type="button">取消</button><button class="button dark" id="save-edit" type="submit">保存修改</button></div></form>`; openLayer("drawer-layer"); bindDrawer(); focusFirst(c); }
    function selectProject(id) { if(state.selectedProject===id) { state.workspace=null; state.menu=null; render(); return; } state.selectedProject=id; state.workspace=null; state.menu=null; state.animateProject=true; render(); }
    function bind() { $$('[data-project]').forEach((b)=>b.addEventListener("click",()=>selectProject(Number(b.dataset.project)))); $$('[data-project-menu]').forEach((b)=>b.addEventListener("click",(e)=>{e.stopPropagation();const k=`project-${b.dataset.projectMenu}`;state.menu=state.menu===k?null:k;render();})); $$('[data-create-project]').forEach((b)=>b.addEventListener("click",()=>openModal("create-project",{},b))); $$('[data-rename-project]').forEach((b)=>b.addEventListener("click",()=>{const p=state.projects.find((x)=>x.id===Number(b.dataset.renameProject));openModal("rename-project",{project:p},b);})); $$('[data-delete-project]').forEach((b)=>b.addEventListener("click",()=>{const p=state.projects.find((x)=>x.id===Number(b.dataset.deleteProject));openModal("delete-project",{project:p},b);})); $$('[data-create-iteration]').forEach((b)=>b.addEventListener("click",()=>openDrawer("create-iteration",{},b))); $$('[data-edit-iteration]').forEach((b)=>b.addEventListener("click",()=>{const item=currentIterations().find((x)=>x.id===Number(b.dataset.editIteration));openDrawer("edit-iteration",{item},b);})); $$('[data-iteration-menu]').forEach((b)=>b.addEventListener("click",(e)=>{e.stopPropagation();const k=`iteration-${b.dataset.iterationMenu}`;state.menu=state.menu===k?null:k;render();})); $$('[data-enter-iteration]').forEach((b)=>b.addEventListener("click",()=>{const item=currentIterations().find((x)=>x.id===Number(b.dataset.enterIteration));if(item){state.workspace=item;state.menu=null;render();}})); $$('[data-delete-iteration]').forEach((b)=>b.addEventListener("click",()=>{const item=currentIterations().find((x)=>x.id===Number(b.dataset.deleteIteration));openModal("delete-iteration",{item},b);})); $$('[data-back-list]').forEach((b)=>b.addEventListener("click",()=>{state.workspace=null;render();})); }
    function bindDrawer() { $$('[data-close-drawer]').forEach((b)=>b.addEventListener("click",()=>{closeLayer("drawer-layer");state.drawer=null;})); $$(".choice").forEach((choice)=>choice.addEventListener("click",()=>{const input=choice.querySelector("input");input.checked=true;state.draftMode=input.value;$(".choice-list")&&$$(".choice").forEach((e)=>e.classList.toggle("selected",e===choice));$("#create-goal-field")?.classList.toggle("show",state.draftMode==="fill");if(state.draftMode==="skip"&&!state.riskConfirmed){openLayer("risk-layer");setTimeout(()=>$("#risk-confirm")?.focus(),20);}})); $("#create-form")?.addEventListener("submit",(e)=>{e.preventDefault();const name=$("#create-name").value.trim(),mode=state.draftMode,goal=$("#create-goal")?.value.trim()||"",error=$("#create-error");if(!name){error.textContent="请先填写展示名称。";$("#create-name").focus();return;}if(!mode){error.textContent="请选择填写本轮目标，或确认暂不填写。";return;}if(mode==="fill"&&!goal){error.textContent="填写目标分支需要至少写下一句话。";$("#create-goal").focus();return;}if(mode==="skip"&&!state.riskConfirmed){openLayer("risk-layer");return;}const id=state.nextIteration[state.selectedProject]||1;state.nextIteration[state.selectedProject]=id+1;const item={id,name,goal:mode==="fill"?goal:"",status:"未开始",updated:"刚刚"};state.iterations[state.selectedProject].unshift(item);selectedProject().updated="刚刚";closeLayer("drawer-layer");state.drawer=null;state.workspace=item;render();showToast(`迭代 ${pad(item.id)} 已创建，已进入工作区。`);}); $("#edit-form")?.addEventListener("submit",(e)=>{e.preventDefault();const item=state.drawer.item,name=$("#edit-name").value.trim();if(!name){$("#edit-error").textContent="展示名称不能为空。";$("#edit-name").focus();return;}const save=$("#save-edit");save.disabled=true;save.textContent="保存中...";setTimeout(()=>{item.name=name;item.goal=$("#edit-goal").value.trim();item.updated="刚刚";selectedProject().updated="刚刚";save.disabled=false;closeLayer("drawer-layer");state.drawer=null;render();showToast("迭代信息已保存，稳定编号保持不变。");},420);}); }
    $("#modal-layer").addEventListener("click",(e)=>{if(e.target.id==="modal-layer"){closeLayer("modal-layer");state.modal=null;render();}}); $("#modal-content").addEventListener("click",(e)=>{const t=e.target;if(t.matches("[data-close-modal]")){closeLayer("modal-layer");state.modal=null;render();return;}if(t.matches("[data-save-project]")){const name=$("#project-name").value.trim();if(!name){$("#project-name").focus();return;}const id=state.nextProject++;state.projects.unshift({id,name,code:`PRODUCT-${String(id).padStart(3,"0")}`,updated:"刚刚"});state.iterations[id]=[];state.nextIteration[id]=1;state.selectedProject=id;state.workspace=null;state.animateProject=true;closeLayer("modal-layer");state.modal=null;render();showToast("项目已创建。");return;}if(t.matches("[data-save-rename]")){const p=state.modal.project,name=$("#rename-project-name").value.trim();if(name){p.name=name;p.updated="刚刚";}closeLayer("modal-layer");state.modal=null;render();showToast("项目名称已更新。");return;}if(t.matches("[data-confirm-delete-project]")){const id=state.modal.project.id;state.projects=state.projects.filter((p)=>p.id!==id);delete state.iterations[id];delete state.nextIteration[id];state.selectedProject=null;state.workspace=null;closeLayer("modal-layer");state.modal=null;render();showToast("项目已删除。");return;}if(t.matches("[data-confirm-delete-iteration]")){const id=state.modal.item.id;state.iterations[state.selectedProject]=currentIterations().filter((item)=>item.id!==id);if(state.workspace?.id===id)state.workspace=null;selectedProject().updated="刚刚";closeLayer("modal-layer");state.modal=null;state.menu=null;render();showToast("产品迭代已删除。");}});
    $("#risk-return").addEventListener("click",()=>{closeLayer("risk-layer");$("[data-choice='skip'] input")?.focus();}); $("#risk-confirm").addEventListener("click",()=>{state.riskConfirmed=true;closeLayer("risk-layer");showToast("已记录选择。创建前仍可返回填写目标。");}); $("#risk-layer").addEventListener("click",(e)=>{if(e.target.id==="risk-layer")closeLayer("risk-layer")}); $("#drawer-layer").addEventListener("click",(e)=>{if(e.target.id==="drawer-layer"){closeLayer("drawer-layer");state.drawer=null;}}); document.addEventListener("click",(e)=>{if(!e.target.closest(".project-item,.iteration-actions")&&state.menu){state.menu=null;render();}}); document.addEventListener("keydown",(e)=>{if(e.key!=="Escape")return;if($("#risk-layer.open"))closeLayer("risk-layer");else if($("#drawer-layer.open")){closeLayer("drawer-layer");state.drawer=null;}else if($("#modal-layer.open")){closeLayer("modal-layer");state.modal=null;render();}else if(state.menu){state.menu=null;render();}});
    render();
  </script>
