oup h3{margin:0;padding:6px 0;color:var(--coral-ink);border-bottom:1px solid rgba(21,20,15,.22);font:600 11px var(--mono)}.loaded-file{min-height:39px}

right:12px;bottom:12px;left:12px;max-width:none}}

<body>
<div class="topline"><div class="topline-inner"><span>AI 产品现场 / <strong>产品迭代工作区</strong></span><span>v1.41</span></div></div>
<main class="workspace">
<header class="workspace-head"><div class="identity"><a class="brand" href="01-product-iteration-lifecycle.html" aria-label="返回产品迭代管理"><span class="mark">A</span><span>AI 产品现场</span></a><strong class="identity-name" id="iteration-name">重做新用户 onboarding</strong><div class="identity-meta"><span id="iteration-number">迭代 01</span><span id="project-name">小红书新用户体验</span></div></div><div class="workspace-tools"><span class="current-fact" id="current-fact">当前阶段 · 需求分析</span><button class="button global-context-toggle" id="toggle-context" type="button" aria-expanded="true">关闭文件区</button><a class="back-link" href="01-product-iteration-lifecycle.html">返回迭代管理</a></div></header>
<section class="stage-nav-wrap" aria-label="四环阶段导航"><div class="stage-nav-top"><span class="mono" id="nav-position">01 / 04</span></div><nav class="stage-nav" id="stage-nav"></nav></section>
<div class="notice" id="soft-gate" role="status"><div class="notice-copy"><strong id="notice-title">还没有确认的前置成果</strong><p id="notice-copy"></p></div><div class="notice-actions"><button class="button" id="notice-back" type="button">返回前置阶段</button><button class="button primary" id="notice-continue" type="button">继续进入</button></div></div>
<section class="workbench" id="workbench" aria-label="阶段工作区">
<aside class="sessions" aria-label="阶段会话列表"><div class="sessions-head"><h2>阶段会话</h2><span id="session-count">3 个示例</span></div><div class="session-list" id="session-list"></div><button class="button new-session" id="new-session" type="button">＋ 新建会话</button></aside>
<section class="conversation" aria-labelledby="conversation-title"><div class="conversation-head"><h2 id="conversation-title">目标与验证依据</h2><span class="conversation-meta" id="conversation-meta">10 条消息</span></div><div class="message-list" id="message-list" aria-live="polite"></div><form class="composer" id="composer"><textarea id="message-input" placeholder="写下你现在想讨论的问题或判断……" aria-label="输入消息"></textarea><div class="composer-foot"><button class="button edit-cancel" id="cancel-edit" type="button" aria-label="取消修改" title="取消修改"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><button class="button dark" id="send-button" type="submit">发送消息</button></div></form></section>
<aside class="context-panel" id="context-panel" aria-label="项目文件树和当前上下文"><div class="context-head"><h2>项目文件与上下文</h2></div><div class="context-tabs" role="tablist"><button type="button" role="tab" id="tree-tab" aria-controls="tree-view" data-context-tab="tree" aria-selected="true" tabindex="0">项目文件树</button><button type="button" role="tab" id="loaded-tab" aria-controls="loaded-view" data-context-tab="loaded" aria-selected="false" tabindex="-1">当前上下文 <span class="context-tab-count" id="loaded-count">8</span></button></div><div class="context-scroll active" id="tree-view" role="tabpanel" aria-labelledby="tree-tab" tabindex="0"><ul class="tree" id="project-tree"></ul></div><div class="context-scroll" id="loaded-view" role="tabpanel" aria-labelledby="loaded-tab" tabindex="0"><div id="loaded-files"></div></div></aside>
</section>
</main><div class="toast" id="toast" role="status"></div>
<script>
const stages=[{key:"analysis",name:"需求分析"},{key:"prototype",name:"原型设计"},{key:"prd",name:"PRD"},{key:"tickets",name:"任务拆分"}];
const examples=[{id:"example-1",title:"用户首次进入产品",meta:"3 条消息",messages:[["agent","先把目标从“让用户理解产品”拆成可观察的行为结果。"],["user","我希望第一次打开产品的人，十分钟内理解 AI 产品经理的工作方式。"],["agent","可以先验证：用户能否说出 AI PM 与传统 PM 的差异，并完成一次从需求到交付的判断。"]]},{id:"example-2",title:"目标与验证依据",meta:"10 条消息",messages:[["user","我们现在只有访谈笔记，没有量化数据。"],["agent","先把访谈中的重复信号标出来，再区分事实、推测和待验证假设。"],["user","最常出现的是“不知道从哪里开始”。"],["agent","这可以成为首个问题假设。你知道用户通常在什么时刻遇到这个问题吗？"],["user","大多是第一次创建项目时，面对空白页面不知道先做什么。"],["agent","那问题可能不只是缺少说明，也可能是起步任务和下一步不够明确。"],["user","我们希望用户能完成一轮完整的产品思考。"],["agent","这是产品目标。可以再拆成首次进入、需求澄清、形成方案等可观察步骤。"],["user","初步成功标准是十分钟内能说清四个阶段分别做什么。"],["agent","已记录为待验证标准。还需要通过新手测试确认用户能独立复述并完成一次阶段选择。"]]},{id:"example-3",title:"范围取舍记录",meta:"3 条消息",messages:[["agent","当前阶段先确认用户与成功标准，再讨论具体方案。"],["user","那是否先不讨论技术实现？"],["agent","是。先记录约束和判断依据，技术方案留到后续阶段。"]]}];
const regenerationVariants={"example-1:0":["先把“让用户理解产品”拆成能够观察和验证的行为结果。","我们先明确用户要理解什么，再把目标转成可观察的判断。"],"example-1:2":["可以先验证：用户能否区分 AI PM 与传统 PM，并完成一次从需求到交付的判断。","一个可验证方向是看用户能否说清 AI PM 的职责差异，并独立走完一次产品判断。"],"example-2:1":["先从访谈中找重复出现的信号，再标注哪些是事实、推测或待验证假设。","我们可以把访谈逐条归类，优先识别重复问题，并把尚未证实的判断单独标出。"],"example-2:3":["这可以先记作问题假设。用户通常是在什么具体情境下，不知道下一步从哪里开始？","我们先保留这个问题假设。能否回忆用户遇到它时正在做什么？"],"example-2:5":["这可能说明问题不止是说明不足，任务起点和后续指引也可能不够清楚。","也许用户缺少的不只是解释，还包括明确的第一步和可预期的下一步。"],"example-2:7":["这是方向性目标。可以继续拆成首次进入、需求澄清、方案形成等可观察行为。","目标还比较宽，可以先按用户首次进入、提出需求、形成方案这些行为逐步拆解。"],"example-2:9":["这是一条待验证标准。还需要通过新手测试，确认用户能否独立复述并完成阶段选择。","先把它记录为假设，再用新手测试观察用户能否说清四阶段并正确选择下一步。"],"example-3:0":["当前先明确用户和成功标准，具体方案可以留到后续阶段展开。","我们先锁定用户问题与成功标准，再进入方案讨论会更稳妥。"],"example-3:2":["对。需求分析阶段先确认问题、用户和依据；技术实现留到后续阶段。","是的。当前先厘清问题与验证依据，技术方案等需求明确后再讨论。"]};

const params=new URLSearchParams(location.search),iterationId=params.get("iteration")||"1",projectKey=params.get("projectCode")||params.get("project")||"project",storageKey=`pm-assistant-v1.41:project:${encodeURIComponent(projectKey)}:iteration:${iterationId}:stage-navigation`,initial={current:"analysis",statuses:{analysis:"未开始",prototype:"未开始",prd:"未开始",tickets:"未开始"}},$=s=>document.querySelector(s),pad=v=>String(v).padStart(2,"0");
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"null");return value&&value.fact&&value.sessions?value:null}catch{return null}}const stored=loadState(),fact=stored?.fact||structuredClone(initial),defaultSessions=examples.map(example=>({id:example.id,stage:"analysis",title:example.title,exampleId:example.id}));let sessions=stored?.sessions||defaultSessions,messages=stored?.messages||Object.fromEntries(examples.map(example=>[example.id,example.messages])),sessionContexts=stored?.contexts||{"example-2":contextSeed.map(([,file])=>file)},selectedSessions=stored?.selectedSessions||{analysis:"example-2"},regenerationCounts=stored?.regenerationCounts||{},pendingStage=null,activeSession=selectedSessions[fact.current]||null,fileOpen=true,loadedFiles=[],sessionSequence=0,editingMessageIndex=null;
function saveState(){localStorage.setItem(storageKey,JSON.stringify({fact,sessions,messages,contexts:sessionContexts,selectedSessions,regenerationCounts}))}function currentStage(){return stages.find(s=>s.key===fact.current)||stages[0]}function restoreContext(){loadedFiles=[...(activeSession?sessionContexts[activeSession]||[]:[])]}function setActiveSession(id){activeSession=id;selectedSessions[fact.current]=id;restoreContext();cancelEdit()}function createSession(){sessionSequence+=1;const id=`session-${Date.now()}-${sessionSequence}`,session={id,stage:fact.current,title:"新的阶段会话"};sessions.push(session);messages[id]=[];sessionContexts[id]=[];setActiveSession(id);fact.statuses[fact.current]="进行中";saveState()}function toast(text){const n=$("#toast");n.textContent=text;n.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove("show"),2300)}
if(activeSession&&fact.statuses[fact.current]==="未开始")fact.statuses[fact.current]="进行中";restoreContext();saveState();
function renderIdentity(){$("#iteration-name").textContent=params.get("iterationName")||"重做新用户 onboarding";$("#iteration-number").textContent=`迭代 ${pad(iterationId)}`;$("#project-name").textContent=params.get("project")||"小红书新用户体验";$("#current-fact").textContent=`当前阶段 · ${currentStage().name}`;document.title=`${params.get("iterationName")||"重做新用户 onboarding"} · AI 产品现场`}
function renderNav(){$("#stage-nav").innerHTML=stages.map((s,i)=>`<button class="stage-tab" data-stage="${s.key}" aria-current="${fact.current===s.key}" type="button"><span class="stage-number">${pad(i+1)}</span><span class="stage-copy"><strong>${s.name}</strong><span class="stage-status">${fact.statuses[s.key]}</span></span></button>`).join("");$("#nav-position").textContent=`${pad(stages.findIndex(s=>s.key===fact.current)+1)} / 04`}
function renderSessions(){const stageSessions=sessions.filter(session=>session.stage===fact.current);$("#session-list").innerHTML=stageSessions.map(session=>{const example=examples.find(item=>item.id===session.exampleId),count=(messages[session.id]||[]).length;return `<button class="session-item" data-session="${session.id}" aria-current="${activeSession===session.id}"><strong>${session.title}</strong><small>${example?example.meta:`${count} 条消息`}</small></button>`}).join("");$("#session-count").textContent=`${stageSessions.length} 个会话`}
const messageIcons={copy:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',edit:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>',quote:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 11H5a2 2 0 0 0-2 2v5h7v-5H6c0-3 1-5 4-7"/><path d="M21 11h-5a2 2 0 0 0-2 2v5h7v-5h-4c0-3 1-5 4-7"/></svg>',regenerate:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.4-3"/></svg>'};
function messageTool(action,index,label){return `<button class="message-tool" type="button" data-message-action="${action}" data-index="${index}" aria-label="${label}" title="${label}">${messageIcons[action]}</button>`}
function renderMessages(){const list=$("#message-list"),session=sessions.find(item=>item.id===activeSession);if(!session){$("#conversation-title").textContent=`${currentStage().name} · 工作区`;$("#conversation-meta").textContent="未开始";list.innerHTML='<div class="empty-session"><strong>从你想解决的问题开始。</strong><p>这个阶段还没有会话。</p><button class="button dark" id="empty-start" type="button">开始本阶段工作</button></div>';$("#empty-start").addEventListener("click",()=>{createSession();render();$("#message-input").focus()});return}const items=messages[session.id]||[],lastUserIndex=items.findLastIndex(([role])=>role==="user");$("#conversation-title").textContent=`${currentStage().name} · ${session.title}`;$("#conversation-meta").textContent=`${items.length} 条消息`;list.innerHTML=items.map(([role,original],index)=>{const regenKey=`${session.id}:${index}`,variants=regenerationVariants[`${session.exampleId||""}:${index}`]||[],count=regenerationCounts[regenKey]??-1,text=count<0?original:variants[count%variants.length]||original;let actions=messageTool("copy",index,"复制消息");if(role==="user"&&index===lastUserIndex)actions+=messageTool("edit",index,"修改并重新发送");if(role==="agent")actions+=messageTool("quote",index,"引用到输入框")+messageTool("regenerate",index,"重新生成");return `<article class="message ${role}"><div class="message-label">${role==="user"?"你":"AI 产品经理 Agent"}</div><div class="message-body">${esc(text)}</div><div class="message-tools">${actions}</div></article>`}).join("");list.scrollTop=list.scrollHeight;$("#composer").classList.toggle("is-editing",editingMessageIndex!==null);$("#send-button").textContent=editingMessageIndex===null?"发送消息":"重新发送"}
function cancelEdit(){editingMessageIndex=null;const input=$("#message-input");if(input)input.value="";$("#composer")?.classList.remove("is-editing");const button=$("#send-button");if(button)button.textContent="发送消息"}
async function copyMessage(text){try{await navigator.clipboard.writeText(text);toast("已复制消息")}catch{const field=document.createElement("textarea");field.value=text;field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();const copied=document.execCommand("copy");field.remove();toast(copied?"已复制消息":"复制失败，请手动选择消息文本")}}
function renderTree(){$("#project-tree").innerHTML=branches.map(branch=>`<li class="tree-branch"><details open><summary>${branch.name} <span class="mono">/ ${branch.files.length}</span></summary><div class="tree-files">${branch.files.map(([name,meta])=>`<div class="tree-file"><span class="tree-file-name" title="${name}">${name}</span><span class="file-revision">${meta}</span><button type="button" data-add="${name}" aria-label="将 ${name} 加入当前上下文">加入</button></div>`).join("")}</details></li>`).join("")}
function renderLoaded(){$("#loaded-count").textContent=loadedFiles.length;const groups=new Map();loadedFiles.forEach(file=>{const branch=branches.find(item=>item.files.some(([name])=>name===file));const key=branch?.name||"其他";if(!groups.has(key))groups.set(key,[]);groups.get(key).push(file)});$("#loaded-files").innerHTML=groups.size?[...groups].map(([name,files])=>`<section class="loaded-group"><h3>${name} · ${files.length}</h3>${files.map(file=>`<div class="loaded-file"><span class="loaded-name" title="${file}">${file}</span><button type="button" data-remove="${file}" aria-label="从当前上下文移除 ${file}">移除</button></div>`).join("")}</section>`).join(""):'<p class="context-empty">当前会话没有加载文件。</p>'}
function renderWorkbench(){ $("#workbench").classList.toggle("file-closed",!fileOpen);$("#toggle-context").textContent=fileOpen?"关闭文件区":"展开文件区";$("#toggle-context").setAttribute("aria-expanded",String(fileOpen)); }
function render(){renderIdentity();renderNav();renderSessions();renderMessages();renderTree();renderLoaded();renderWorkbench()}
function missingBefore(key){const i=stages.findIndex(s=>s.key===key);return stages.slice(0,i).find(s=>fact.statuses[s.key]!=="已完成")}
function goStage(key){$("#soft-gate").classList.remove("open");pendingStage=null;fact.current=key;setActiveSession(selectedSessions[key]||null);if(activeSession&&fact.statuses[key]==="未开始")fact.statuses[key]="进行中";if(fact.statuses[key]==="已完成")fact.statuses[key]="进行中";saveState();render()}
function selectStage(key){if(key===fact.current)return;const missing=missingBefore(key);if(missing){pendingStage=key;const target=stages.find(s=>s.key===key);$("#notice-title").textContent=`还没有确认的${missing.name}成果`;$("#notice-copy").textContent=`直接进入${target.name}，可能让工作缺少${missing.name}依据。你仍可以继续。`;$("#notice-back").textContent=`返回${missing.name}`;$("#notice-continue").textContent=`继续进入${target.name}`;$("#notice-back").onclick=()=>goStage(missing.key);$("#notice-continue").onclick=()=>goStage(pendingStage);$("#soft-gate").classList.add("open");return}goStage(key)}
function startStage(){if(!activeSession)createSession();fact.statuses[fact.current]="进行中";saveState();render();$("#message-input").focus()}
function esc(text){return text.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
$("#stage-nav").addEventListener("click",e=>{const b=e.target.closest("[data-stage]");if(b)selectStage(b.dataset.stage)});
$("#session-list").addEventListener("click",e=>{const b=e.target.closest("[data-session]");if(!b)return;setActiveSession(b.dataset.session);if(fact.statuses[fact.current]==="未开始")fact.statuses[fact.current]="进行中";saveState();renderNav();renderSessions();renderMessages();renderLoaded()});
$("#message-list").addEventListener("click",async e=>{const button=e.target.closest("[data-message-action]");if(!button)return;const index=Number(button.dataset.index),items=messages[activeSession]||[],item=items[index];if(!item)return;const action=button.dataset.messageAction;if(action==="copy"){await copyMessage(button.closest(".message").querySelector(".message-body").innerText);return}if(action==="quote"){const input=$("#message-input"),newline=String.fromCharCode(10),body=button.closest(".message").querySelector(".message-body").innerText,quote=`> ${body.split(newline).join(`${newline}> `)}${newline}${newline}`;input.value=input.value?`${input.value}${newline}${quote}`:quote;input.focus();input.setSelectionRange(input.value.length,input.value.length);return}if(action==="edit"){editingMessageIndex=index;$("#composer").classList.add("is-editing");$("#send-button").textContent="重新发送";$("#message-input").value=item[1];$("#message-input").focus();$("#message-input").setSelectionRange(item[1].length,item[1].length);return}if(action==="regenerate"){const session=sessions.find(entry=>entry.id===activeSession),variants=regenerationVariants[`${session?.exampleId||""}:${index}`]||[];if(!variants.length){toast("这条消息暂无其他回复版本");return}const key=`${activeSession}:${index}`;regenerationCounts[key]=((regenerationCounts[key]??-1)+1)%variants.length;saveState();renderMessages();toast("已显示另一版回复")}});
$("#new-session").addEventListener("click",()=>{createSession();render();$("#message-input").focus()});
$("#workbench").addEventListener("click",e=>{const add=e.target.closest("[data-add]");if(add){if(!activeSession){toast("请先开始一个阶段会话。");return}if(!loadedFiles.includes(add.dataset.add))loadedFiles.push(add.dataset.add);sessionContexts[activeSession]=[...loadedFiles];saveState();renderLoaded();toast(`已加入「${add.dataset.add}」`);return}const remove=e.target.closest("[data-remove]");if(remove){loadedFiles=loadedFiles.filter(file=>file!==remove.dataset.remove);sessionContexts[activeSession]=[...loadedFiles];saveState();renderLoaded();toast(`已移除「${remove.dataset.remove}」`)}});
function activateContextTab(button,focusPanel=false){document.querySelectorAll("[data-context-tab]").forEach(item=>{const selected=item===button;item.setAttribute("aria-selected",String(selected));item.tabIndex=selected?0:-1});document.querySelectorAll(".context-scroll").forEach(panel=>panel.classList.toggle("active",panel.id===button.getAttribute("aria-controls")));if(focusPanel)document.getElementById(button.getAttribute("aria-controls")).focus()}
